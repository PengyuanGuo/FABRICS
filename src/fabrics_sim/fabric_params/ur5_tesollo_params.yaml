          - 0.05
          - 0.032
          - 0.0316
          - 0.034
          - 0.0316
          - 0.0313
          - 0.0287
          - 0.017
          - 0.0178
          - 0.0161
          - 0.0169
          - 0.0142
          - 0.0159
          - 0.014
          - 0.0169
          - 0.0161
          - 0.0169
          - 0.0161
          - 0.0136
          - 0.0145
          - 0.0127
          - 0.0169
          - 0.0161
          - 0.0169
