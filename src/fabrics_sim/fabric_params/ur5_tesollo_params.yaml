          - 0.014
      collision_sphere_pairs: []
      # Prefix match expands to all sphere frames whose name contains the prefix.
      # Hand vs long arm bones (self-collision); thumb vs other digits (DG5F thumb
      # hits palm/neighbors at large yaw — tesollo_env_validation.md §15).
      # Thumb vs palm skips left_link_1_2: its spheres overlap the palm spheres in
      # every posture (adjacent links), which kept collision_status on permanently.
      collision_link_prefix_pairs:
          [["left_link_", "ur5_upper_arm_link"],
           ["left_link_", "ur5_forearm_link"],
           ["palm_sphere", "ur5_upper_arm_link"],
           ["palm_sphere", "ur5_forearm_link"],
           ["left_link_base", "ur5_upper_arm_link"],
           ["left_link_base", "ur5_forearm_link"],
           ["left_link_1", "left_link_2"],
           ["left_link_1", "left_link_3"],
           ["left_link_1", "left_link_4"],
           ["left_link_1", "left_link_5"],
           ["left_link_1_3", "palm_sphere"],
           ["left_link_1_4", "palm_sphere"],
           ["left_link_1_3", "left_link_base"],
           ["left_link_1_4", "left_link_base"]]

    cspace_damping:
      gain: 10.

    # Off for CP1; enable in CP3 (ADEPT: energy_target 1.0, damping 100).
    speed_control:
      active: False
      energy_target: 1.0
      damping: 100.

    joint_limits:
      active: True
      # 6 arm (UR5) + 20 hand. Arm seeded from Kuka iiwa; fingers from Allegro.
      acceleration: [7.5, 7.5, 10., 12.5, 15., 20.,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5]
      # Arm jerk ≈ 500 * accel; finger jerk ≈ 100 * accel (Allegro convention).
      jerk: [3750., 3750., 5000., 6250., 7500., 10000.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.]
