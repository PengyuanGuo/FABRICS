# v2 hand variant of ur5_tesollo_params.yaml: hand spheres from fit_hand_spheres.py --profile v2
# on ur5_dg5fs_left_w_mount.urdf (palm, knuckle left_link_<f>_1 through fingertip; tip caps
# may be 3.5 mm uncovered). Arm spheres and all gains identical to ur5_tesollo_params.yaml.
# Sphere arrays are written by build_fabric_urdf.py --params.
# UR5 + Tesollo DG5F-S (left) fabric parameters — Variant A (cspace).
#
# Source of truth for the SimToolReal integration. Also mirrored under
# fabrics_sim/fabric_params/ so BaseFabric.load_params("ur5_tesollo_params.yaml")
# works for standalone Phase 1 tests.
#
# Sphere frame names must match
#   models/robots/urdf/ur5_tesollo/ur5_dg5fs_left_fabric.urdf
# (regenerate with ur5_tesollo_description/build_fabric_urdf.py --print-frames).
#
# Joint order for acceleration/jerk (26): 6 UR5 arm + 20 hand
#   (left_joint_{1..5}_{1..4}, thumb first).

fabric_params:
    robot_urdf: ur5_dg5fs_left_fabric_v2
    # HD2 geometric posture attractor (not forcing). Target = default_config
    # set in Ur5TesolloFabric (arm home + lightly curled fingers).
    cspace_attractor:
        min_isotropic_mass: 1.
        max_isotropic_mass: 1.
        mass_sharpness: 20.0
        mass_switch_offset: 1.
        conical_sharpness: 20.
        conical_gain: 1.

    # Variant A: HD1 forcing attractor on full C-space (policy q* target).
    # Gains seeded from Kuka hand_attractor / ADEPT B.2 structure. Phase 1b: the delta
    # policy keeps |q* - q_f| ~ 0.1 * sqrt(#moving joints) ~ 0.25 rad, so damping_radius 0.2
    # (sharpness 10) left the damping half on during every move (cruise ~0.8 rad/s, 3 s reach
    # 88 % even without self pairs). 0.1 / 20: damping engages only near the goal.
    forcing_cspace_attractor:
        min_isotropic_mass: 8.
        max_isotropic_mass: 8.
        mass_sharpness: 20.
        mass_switch_offset: 0.5
        conical_sharpness: 40.
        conical_gain: 50.
        damping: 50.
        damping_sharpness: 20.
        damping_radius: 0.1

    # ADEPT App. B.2: q* = [q*_arm, q*_hand] on two attractors (own error norm and damping radius
    # per group), so finger error does not throttle the arm and vice versa. Same gains as the
    # single attractor above, which is used when forcing_partition is false.
    forcing_partition: true
    forcing_arm_attractor:
        min_isotropic_mass: 8.
        max_isotropic_mass: 8.
        mass_sharpness: 20.
        mass_switch_offset: 0.5
        conical_sharpness: 40.
        conical_gain: 50.
        damping: 50.
        damping_sharpness: 20.
        damping_radius: 0.1
    forcing_hand_attractor:
        min_isotropic_mass: 8.
        max_isotropic_mass: 8.
        mass_sharpness: 20.
        mass_switch_offset: 0.5
        conical_sharpness: 40.
        conical_gain: 50.
        damping: 50.
        damping_sharpness: 20.
        damping_radius: 0.1

    # type adept: ADEPT App. B.4 barrier (JointLimitBarrier) on range-normalised clearance
    #   x = (q_upper - q) / range; offsets are fractions of range, metric_scalar is the same in
    #   rad (root metric = k_b / (d - offset * range)^2), max_metric is per unit range^2
    #   (4e5 -> ~1e4 at the arm limits, range 2 pi), soft_relu_gain in range/s^2, damping_gain
    #   1/s. Tanh velocity gate with gate_offset < 0: off at rest, so targets at a limit are
    #   reachable (gate 0.5 at rest held fingers ~0.1 rad off their limits). hold_*: position
    #   floor on the gate (our addition), fully on within the last 0.2 % of range, so slow
    #   pushes cannot creep past a limit. Zero q_f overshoot in all Phase 1b sets.
    # type kuka: upstream JointLimitRepulsion in rad (bang-bang gate). Old values:
    #   metric_scalar 0.02, metric_exploder_offset 0.1, max_metric 100, soft_relu_gain 8,
    #   damping_gain 8 (q_f overshoot up to 0.49 rad with self pairs on).
    joint_limit_repulsion:
        type: adept
        metric_scalar: 0.3
        metric_exploder_offset: 0.
        max_metric: 400000.
        soft_relu_gain: 2.
        damping_gain: 60.
        gate_sharpness: 30.
        gate_offset: -0.05
        hold_offset: 0.002
        hold_sharpness: 2000.
        # kuka only
        velocity_gate: True
        breakaway_distance: 0.0
        breakaway_velocity: 0.

    # Kept for Variant B (palm + PCA / raw hand). Unused by Variant A construct_fabric.
    hand_attractor:
        min_isotropic_mass: 8.
        max_isotropic_mass: 8.
        mass_sharpness: 20.
        mass_switch_offset: 0.5
        conical_sharpness: 40.
        conical_gain: 50.
        damping: 50.
        damping_sharpness: 10.
        damping_radius: 0.2
    palm_attractor:
        min_isotropic_mass: 1.
        max_isotropic_mass: 1.
        mass_sharpness: 10.
        mass_switch_offset: 0.5
        conical_sharpness: 40.
        conical_gain: 50.
        damping: 50.
        damping_sharpness: 10.
        damping_radius: 0.2

    # Phase 1b: the repulsion must beat the delta-policy pull (target kept 0.1 rad beyond q_f,
    # forcing mass 8): forcing_metric_scalar 0.01 -> 0.3, constant_accel 1 -> 3, damping_gain
    # 0 -> 20. The constant push biases goals near an obstacle, so sphere pairs engage only
    # within self_engage_depth 3 cm; the table (world) keeps engage_depth 0.5.
    # metric_normalization: body = upstream Frobenius norm over the whole body metric;
    # sphere = per-sphere blocks (ADEPT B.3), tested and worse here.
    body_repulsion:
      max_depth: 2.
      min_depth: 0.01
      engage_depth: 0.5
      self_engage_depth: 0.03
      metric_normalization: body
      breakaway_depth: 0.0
      breakaway_velocity: 0.
      metric_scalar: 1.
      velocity_gate: True
      velocity_gate_sharpness: 1000.
      velocity_gate_offset: 0.002
      rescaled_min_dist: .01
      forcing_metric_scalar: .3
      geom_metric_scalar: .01
      constant_accel: 3.
      constant_accel_geom: 5.
      damping_gain: 20.
      # Table (world mesh) response per sphere group, used only when a world is loaded (A2).
      # The distal finger spheres (13-17 mm) are fatter than the fingers: on the A1 policy
      # (eval_phase5.py --table_stats, object still on the table) they reach 1-2 cm into the
      # table plane at p1-p0.1 in normal grasps of the 17 mm handle, while palm / mount / arm
      # stay >= 2 cm above it. So finger spheres meet the table with a smaller world radius
      # (5 mm distal+middle, 8 mm proximal), engaging from 0.3 m so a fast hand still stops;
      # arm / palm / mount keep the full sphere and engage_depth. Table check (sink goals,
      # 256): worst mesh penetration 6.5 mm (full spheres 1.1 mm; 3 cm engage 150 mm).
      # world_radius only applies to world meshes; first matching prefix wins.
      world_sphere_overrides:
        - {prefix: left_link_1_3, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_1_4, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_2_3, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_2_4, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_3_3, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_3_4, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_4_3, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_4_4, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_5_3, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_5_4, engage_depth: 0.3, world_radius: 0.005}
        - {prefix: left_link_1_, engage_depth: 0.3, world_radius: 0.008}
        - {prefix: left_link_2_, engage_depth: 0.3, world_radius: 0.008}
        - {prefix: left_link_3_, engage_depth: 0.3, world_radius: 0.008}
        - {prefix: left_link_4_, engage_depth: 0.3, world_radius: 0.008}
        - {prefix: left_link_5_, engage_depth: 0.3, world_radius: 0.008}
      # 53 spheres: 12 arm, 6 palm, 35 finger (3 per distal link incl. tip); build_fabric_urdf.py --params syncs these.
      collision_sphere_frames:
          - ur5_shoulder_link_sphere1
          - ur5_upper_arm_link_sphere1
          - ur5_upper_arm_link_sphere2
          - ur5_upper_arm_link_sphere3
          - ur5_upper_arm_link_sphere4
          - ur5_forearm_link_sphere1
          - ur5_forearm_link_sphere2
          - ur5_forearm_link_sphere3
          - ur5_forearm_link_sphere4
          - ur5_wrist_1_link_sphere1
          - ur5_wrist_2_link_sphere1
          - ur5_wrist_3_link_sphere1
          - left_link_base_v2_1
          - left_link_1_2_v2_1
          - left_link_1_2_v2_2
          - left_link_1_3_v2_1
          - left_link_1_3_v2_2
          - left_link_1_4_v2_1
          - left_link_1_4_v2_2
          - left_link_2_1_v2_1
          - left_link_2_2_v2_1
          - left_link_2_2_v2_2
          - left_link_2_3_v2_1
          - left_link_2_4_v2_1
          - left_link_2_4_v2_2
          - left_link_3_1_v2_1
          - left_link_3_2_v2_1
          - left_link_3_2_v2_2
          - left_link_3_3_v2_1
          - left_link_3_4_v2_1
          - left_link_3_4_v2_2
          - left_link_4_1_v2_1
          - left_link_4_2_v2_1
          - left_link_4_2_v2_2
          - left_link_4_3_v2_1
          - left_link_4_4_v2_1
          - left_link_4_4_v2_2
          - left_link_5_1_v2_1
          - left_link_5_2_v2_1
          - left_link_5_3_v2_1
          - left_link_5_4_v2_1
          - left_link_5_4_v2_2
          - left_link_mount_v2_1
      # Metres. Arm: p99 cover of each link's visual mesh by its own spheres (ARM_RADII in
      # build_fabric_urdf.py; the old hand-tuned radii left 47-67 % of the upper arm / forearm
      # mesh outside, the cause of hand-arm mesh contact). Hand: clipped-mesh fit + 1 mm.
      collision_sphere_radii:
          - 0.105
          - 0.088
          - 0.088
          - 0.088
          - 0.09
          - 0.074
          - 0.073
          - 0.074
          - 0.077
          - 0.065
          - 0.065
          - 0.05
          - 0.047
          - 0.017
          - 0.017
          - 0.017
          - 0.017
          - 0.017
          - 0.0142
          - 0.0245
          - 0.0161
          - 0.0161
          - 0.0161
          - 0.0159
          - 0.0124
          - 0.0245
          - 0.0161
          - 0.0161
          - 0.0161
          - 0.0161
          - 0.0126
          - 0.0245
          - 0.0161
          - 0.0161
          - 0.0161
          - 0.0161
          - 0.013
          - 0.0251
          - 0.0197
          - 0.0175
          - 0.0175
          - 0.0129
          - 0.0328
      collision_sphere_pairs: []
      # Prefix match expands to all sphere frames whose name contains the prefix.
      # Hand vs long arm bones only. Thumb-finger / thumb-palm pairs were dropped in Phase 1b:
      # they neither prevented thumb-index pass-through nor mattered for pinch reach
      # (fabric_self_collision_checks.py --check hand), cost 238 pairs, and PhysX already
      # resolves finger-finger contact.
      # v2: every hand sphere (palm included) is named left_link_*_v2_<k>.
      collision_link_prefix_pairs:
          [["left_link_", "ur5_upper_arm_link"],
           ["left_link_", "ur5_forearm_link"]]

    cspace_damping:
      gain: 10.

    # ADEPT App. B.5: extra damping b_sc M qd while E > E*. energy: arm_palm measures E as
    # 0.5 * 0.75 |qd_arm|^2 + 0.5 * 0.25 |v_palm|^2 (hand excluded); cspace = all joints.
    # Energization always uses the all-joint energy (arm/palm energization is singular when
    # the arm stops and the fingers move). E* and damping are ADR knobs in ADEPT.
    speed_control:
      active: True
      energy: arm_palm
      arm_energy_scale: 0.75
      palm_energy_scale: 0.25
      # The palm_sphere frame belongs to the 53-sphere model; this URDF only has this model's
      # frames, so measure the palm energy at the palm link origin.
      palm_frame: left_link_base
      energy_target: 1.0
      damping: 100.

    # Metric inverse: torch (batched cuSOLVER Cholesky, graph capturable) or warp (upstream).
    metric_inverse: torch

    joint_limits:
      active: True
      # 6 arm (UR5) + 20 hand. Arm seeded from Kuka iiwa; fingers from Allegro.
      acceleration: [7.5, 7.5, 10., 12.5, 15., 20.,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5,
                     22.5, 22.5, 22.5, 22.5]
      # Arm jerk ≈ 500 * accel; finger jerk ≈ 100 * accel (Allegro convention).
      jerk: [3750., 3750., 5000., 6250., 7500., 10000.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.,
             2250., 2250., 2250., 2250.]
